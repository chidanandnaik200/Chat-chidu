
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chidu Chat</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .chat {
      width: 100%;
      max-width: 520px;
      height: min(760px, 90vh);
      display: flex;
      flex-direction: column;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px #0005;
    }

    header {
      padding: 18px;
      background: #2563eb;
    }

    header h1 { margin: 0 0 6px; font-size: 23px; }
    header p { margin: 0; font-size: 13px; opacity: .9; }

    .setup {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid #334155;
    }

    input, button { font: inherit; }

    input {
      min-width: 0;
      width: 100%;
      padding: 12px;
      color: white;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 10px;
      outline: none;
    }

    input:focus { border-color: #60a5fa; }

    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      align-self: flex-start;
      padding: 10px 13px;
      background: #334155;
      border-radius: 5px 14px 14px 14px;
      overflow-wrap: anywhere;
    }

    .message.mine {
      align-self: flex-end;
      background: #2563eb;
      border-radius: 14px 5px 14px 14px;
    }

    .sender { font-size: 12px; font-weight: bold; margin-bottom: 5px; }
    .body { white-space: pre-wrap; }
    .time { font-size: 10px; opacity: .75; margin-top: 6px; }

    #status {
      padding: 7px 14px;
      color: #cbd5e1;
      font-size: 12px;
    }

    #composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #334155;
    }

    #composer input { flex: 1; }
    #error { color: #fca5a5; padding: 0 14px 10px; font-size: 12px; }

    @media (max-width: 480px) {
      body { padding: 0; }
      .chat { height: 100dvh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <h1>💬 Chidu Chat</h1>
      <p>One room. Everyone connected. Messages in real time.</p>
    </header>

    <div class="setup">
      <input id="name" maxlength="20" placeholder="Your display name" />
      <button id="join">Join</button>
    </div>

    <div id="status">Connecting...</div>
    <section id="messages" aria-live="polite"></section>
    <div id="error" role="alert"></div>

    <form id="composer">
      <input id="message" maxlength="500"
        placeholder="Type a message..." autocomplete="off" disabled />
      <button id="send" disabled>Send</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

    import { getAuth, signInAnonymously } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    import {
      getDatabase, ref, push, query, limitToLast,
      onValue, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    // STEP 1: Replace these placeholder values with your Firebase web config.
    
   const firebaseConfig = {
      apiKey: "AIzaSyDZMu9Gio-SZcmlWD1CnWofPBnidBfNu_s",
      authDomain: "chat-chidu-152d6.firebaseapp.com",
      databaseURL: "https://chat-chidu-152d6-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chat-chidu-152d6",
      appId: "1:676851549782:web:cc8d6ec1a06b613f131df7"
    };

    const $ = id => document.getElementById(id);
    const nameInput = $("name");
    const messageInput = $("message");
    const messagesBox = $("messages");
    const status = $("status");
    const errorBox = $("error");
    const joinButton = $("join");
    const sendButton = $("send");

    let db;
    let currentUser = null;
    let displayName = "";
    let joined = false;
    let sending = false;

    function showError(message) {
      errorBox.textContent = message;
    }

    function updateControls() {
      messageInput.disabled = !joined || !currentUser;
      sendButton.disabled =
        !joined || !currentUser || sending || !messageInput.value.trim();
    }

    messageInput.addEventListener("input", updateControls);

    try {
      if (firebaseConfig.apiKey === "YOUR_API_KEY") {
        throw new Error("Add your Firebase web configuration to index.html.");
      }

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      db = getDatabase(app);

      const credential = await signInAnonymously(auth);
      currentUser = credential.user;

      status.textContent = "Connected • Choose a name to join";
      joinButton.disabled = false;

      const messagesQuery = query(
        ref(db, "messages"),
        limitToLast(100)
      );

      onValue(messagesQuery, snapshot => {
        messagesBox.replaceChildren();

        snapshot.forEach(child => {
          const msg = child.val();
          if (!msg || typeof msg.text !== "string") return;

          const bubble = document.createElement("article");
          bubble.className =
            "message" + (msg.uid === currentUser.uid ? " mine" : "");

          const sender = document.createElement("div");
          sender.className = "sender";
          sender.textContent = msg.name || "Guest";

          const body = document.createElement("div");
          body.className = "body";
          body.textContent = msg.text;

          const time = document.createElement("div");
          time.className = "time";
          time.textContent = Number.isFinite(msg.timestamp)
            ? new Date(msg.timestamp).toLocaleTimeString([], {
                hour: "2-digit", minute: "2-digit"
              })
            : "Just now";

          bubble.append(sender, body, time);
          messagesBox.append(bubble);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
        showError("");
      }, error => {
        showError("Couldn't load messages. Check your Firebase rules.");
        console.error(error);
      });

    } catch (error) {
      status.textContent = "Setup required";
      showError(error.message || "Couldn't connect to Firebase.");
      joinButton.disabled = true;
      console.error(error);
    }

    joinButton.addEventListener("click", () => {
      const name = nameInput.value.trim();

      if (!name) {
        showError("Please enter a display name.");
        return;
      }

      displayName = name.slice(0, 20);
      joined = true;
      nameInput.value = displayName;
      nameInput.disabled = true;
      joinButton.disabled = true;
      status.textContent = "You're in the chat! 🎉";
      showError("");
      updateControls();
      messageInput.focus();
    });

    $("composer").addEventListener("submit", async event => {
      event.preventDefault();

      const text = messageInput.value.trim();
      if (!text || !joined || !currentUser || sending) return;

      sending = true;
      updateControls();
      showError("");

      try {
        await push(ref(db, "messages"), {
          uid: currentUser.uid,
          name: displayName,
          text: text.slice(0, 500),
          timestamp: serverTimestamp()
        });

        messageInput.value = "";
      } catch (error) {
        showError("Message not sent. Please try again.");
        console.error(error);
      } finally {
        sending = false;
        updateControls();
        messageInput.focus();
      }
    });
  </script>
</body>
</html>
